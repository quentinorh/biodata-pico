<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plante Musicale — Biodata</title>
<link rel="stylesheet" href="style.css?v=map18">
</head>
<body>

<canvas id="graph"></canvas>

<div class="threshold-label hi" id="threshHiLabel"></div>
<div class="threshold-label lo" id="threshLoLabel"></div>
<div class="chrome-top">
  <div class="toolbar">
    <button type="button" class="tool-btn" id="settingsToggle" onclick="toggleSettings()" title="R&eacute;glages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2" fill="currentColor"/><circle cx="15" cy="12" r="2.2" fill="currentColor"/><circle cx="8" cy="17" r="2.2" fill="currentColor"/></svg>
    </button>
    <button type="button" class="tool-btn" id="infoToggle" onclick="toggleInfo()" title="Paramètres généraux" aria-label="Paramètres généraux" inert aria-hidden="true">
      <svg viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
    </button>
    <div class="role-pips" id="rolePips" role="tablist" aria-label="Piste" inert aria-hidden="true">
      <button type="button" class="tool-btn role-tab role-pip active" data-role="vegetal" role="tab" aria-selected="true" title="Végétal" aria-label="Végétal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" d="M5.4 19.6c1.1-7.4 5.8-13.2 13.4-14.4-1.1 7.4-5.8 13.2-13.4 14.4z"/><path fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" d="M5.4 19.6c2.8-3.6 6.6-7.4 11.2-10.2"/></svg>
      </button>
      <button type="button" class="tool-btn role-tab role-pip" data-role="interaction" role="tab" aria-selected="false" title="Toucher" aria-label="Toucher">
        <svg viewBox="1.2 3.4 19.4 17.8" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" d="M7.9,12.2V7.4c0-0.7,0.6-1.3,1.4-1.3c0.8,0,1.4,0.6,1.4,1.3v5.1 M10.7,11.6v-5c0-0.7,0.6-1.3,1.4-1.3
          c0.8,0,1.4,0.6,1.4,1.3v5.2 M13.6,12V8.8c0-0.7,0.6-1.3,1.4-1.3c0.7,0,1.3,0.6,1.3,1.3V15c0,2.9-2,4.7-4.9,4.7h-0.7
          c-3.2,0-5.6-2.1-5.6-5.3v-1.6v-0.4v-1.3c0-0.7,0.6-1.3,1.4-1.3s1.4,0.6,1.4,1.3v1.1"/></svg>
      </button>
      <button type="button" class="tool-btn role-tab role-pip" data-role="ambiance" role="tab" aria-selected="false" title="Ambiance" aria-label="Ambiance">
        <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
          <path class="st0" d="M4,6.9c1.8-1.4,3.5-1.4,5.4,0s3.5,1.4,5.4,0s3.5-1.4,5.4,0"/>
          <path class="st0" d="M4,10.5c1.8-1.4,3.5-1.4,5.4,0s3.5,1.4,5.4,0s3.5-1.4,5.4,0"/>
          <path class="st0" d="M4,14.1c1.8-1.4,3.5-1.4,5.4,0s3.5,1.4,5.4,0s3.5-1.4,5.4,0"/>
          <path class="st0" d="M4,17.8c1.8-1.4,3.5-1.4,5.4,0s3.5,1.4,5.4,0s3.5-1.4,5.4,0"/>
        </g></svg>
      </button>
    </div>
    <span id="recTimer" class="toolbar-rec-timer" hidden></span>
  </div>
</div>

<div class="span-controls" role="group" aria-label="Vue du graphe">
  <button type="button" class="tool-btn" id="spanPlus" onclick="nudgePointSpacing(1)" title="Écarter les points" aria-label="Écarter les points">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 6v12M6 12h12"/></svg>
  </button>
  <button type="button" class="tool-btn" id="spanMinus" onclick="nudgePointSpacing(-1)" title="Rapprocher les points" aria-label="Rapprocher les points">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 12h12"/></svg>
  </button>
  <button type="button" class="tool-btn" id="viewRecenter" onclick="recenterView()" title="Recentrer sur les dernières impulsions" aria-label="Recentrer">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.4" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 3.2v2.6M12 18.2v2.6M3.2 12h2.6M18.2 12h2.6"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
  </button>
</div>

<div class="stat-extremum stat-max" title="Maximum">
  <span id="max">&mdash;</span><span class="unit"> µs</span>
</div>
<div class="stat-extremum stat-min" title="Minimum">
  <span id="min">&mdash;</span><span class="unit"> µs</span>
</div>
<div class="settings-backdrop" id="settingsBackdrop" onclick="closeSettings()"></div>

<div class="bottom-right">
  <div class="stats">
    <div class="stat">
      <span class="label">Impulsions/s</span>
      <span class="value" id="rate">&mdash;</span>
    </div>
    <div class="stat">
      <span class="label">Moyenne</span>
      <span class="value"><span id="avg">&mdash;</span>
    </div>
    <div class="stat">
      <span class="label">Total</span>
      <span class="value" id="total">0</span>
    </div>
  </div>
</div>

<div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Réglages" aria-modal="true" aria-hidden="true">
  <div class="settings-head">
    <div class="settings-head-spacer" aria-hidden="true"></div>
    <div class="settings-mix">
      <div class="param-row mix-cell">
        <div class="param-head">
          <label for="param-masterVol" class="param-label">VOL</label>
        </div>
        <input id="param-masterVol" type="range" min="0" max="100" value="50" data-param="masterVol">
        <span class="param-val">50%</span>
      </div>
      <div class="param-row mix-cell">
        <div class="param-head">
          <label for="param-bpm" class="param-label" title="60 = vitesse d'origine du patch">BPM</label>
        </div>
        <input id="param-bpm" type="range" min="20" max="160" value="60" data-param="bpm">
        <span class="param-val">60</span>
      </div>
    </div>
  </div>

  <div class="settings-body">
    <div id="rolePanel"></div>
    <div id="infoPanel" class="info-body" hidden>
    <section class="settings-section">
      <h3>Capteur</h3>
      <div class="settings-card">
        <div class="settings-status-row">
          <span id="status" class="connect-status off">D&eacute;connect&eacute;</span>
          <button type="button" class="settings-btn compact" id="btn" onclick="toggle()">Reconnecter</button>
        </div>
        <p class="connect-info" id="connectInfo">Wi-Fi Plante-Musicale · http://192.168.4.1</p>
      </div>
    </section>
    <section class="settings-section">
      <h3>Datalogger</h3>
      <button type="button" class="settings-btn" id="recToggle" onclick="toggleRecord()">Enregistrer 60 s</button>
    </section>
    <section class="settings-section">
      <h3>Enregistrer / charger</h3>
      <div class="settings-files">
        <button type="button" class="settings-btn" id="cfgSave">Enregistrer</button>
        <button type="button" class="settings-btn" id="cfgLoad">Charger</button>
        <input type="file" id="cfgFile" accept="application/json,.json" hidden>
      </div>
    </section>
    <section class="settings-section">
      <h3>Affichage</h3>
      <label class="toggle-row">
        <span class="switch">
          <input type="checkbox" id="graphAnimEnabled" checked>
          <span class="switch-ui"></span>
        </span>
        <span>
          <strong>Animations du graphe</strong>
          <small>Ondulations autour des notes. À couper si le téléphone ralentit</small>
        </span>
      </label>
    </section>
    <section class="settings-section">
      <h3>Suivi automatique</h3>
      <label class="toggle-row">
        <span class="switch">
          <input type="checkbox" id="dynThreshEnabled">
          <span class="switch-ui"></span>
        </span>
        <span>
          <strong>Seuils dynamiques</strong>
          <small>Les seuils suivent le signal, avec une marge et un lissage</small>
        </span>
      </label>
      <div id="dynThreshControls" hidden>
        <div class="param-row">
          <div class="param-head">
            <label for="param-threshMargin" class="param-label">Marge</label>
          </div>
          <input id="param-threshMargin" type="range" min="4" max="100" value="18" data-general="threshMarginPct">
          <span class="param-val">18 %</span>
        </div>
        <div class="param-row">
          <div class="param-head">
            <label for="param-threshSmooth" class="param-label">Lissage</label>
          </div>
          <input id="param-threshSmooth" type="range" min="300" max="20000" step="100" value="2500" data-general="threshSmoothMs" title="Centre des seuils : moyenne des X dernières secondes">
          <span class="param-val">2,5 s</span>
        </div>
      </div>
      <label class="toggle-row">
        <span class="switch">
          <input type="checkbox" id="autoZoomEnabled">
          <span class="switch-ui"></span>
        </span>
        <span>
          <strong>Centrage et zoom auto</strong>
          <small>Zoom sur les données visibles, centré sur la moyenne des X dernières secondes</small>
        </span>
      </label>
      <div id="autoZoomControls" hidden>
        <div class="param-row">
          <div class="param-head">
            <label for="param-zoomMargin" class="param-label">Marge</label>
          </div>
          <input id="param-zoomMargin" type="range" min="2" max="120" value="8" data-general="zoomMarginPct" title="Marge verticale de chaque côté du zoom">
          <span class="param-val">8 %</span>
        </div>
        <div class="param-row">
          <div class="param-head">
            <label for="param-zoomSmooth" class="param-label">Lissage</label>
          </div>
          <input id="param-zoomSmooth" type="range" min="200" max="20000" step="100" value="600" data-general="zoomSmoothMs" title="Centrage sur la moyenne des X dernières secondes">
          <span class="param-val">0,6 s</span>
        </div>
      </div>
    </section>
    <section class="settings-section">
      <h3>Transition sonore</h3>
      <label class="toggle-row">
        <span class="switch">
          <input type="checkbox" id="zoneXfadeEnabled" checked>
          <span class="switch-ui"></span>
        </span>
        <span>
          <strong>Transition végétal / toucher</strong>
          <small>Décroissance progressive entre végétal et toucher. Sans impulsions, tous les sons s’éteignent de la même façon.</small>
        </span>
      </label>
      <div id="zoneXfadeControls">
        <div class="param-row">
          <div class="param-head">
            <label for="param-zoneXfade" class="param-label">Durée</label>
          </div>
          <input id="param-zoneXfade" type="range" min="80" max="20000" step="50" value="1200" data-general="zoneXfadeMs">
          <span class="param-val">1,2 s</span>
        </div>
      </div>
    </section>
    </div>
  </div>
</div>

<script src="faust/catalog.js?v=hashes"></script>
<script src="faust-player.js?v=stable2"></script>
<script src="script.js?v=map16"></script>
</body>
</html>
